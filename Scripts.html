<script>
  // =========================================================================
  // SECTOR 1: VARIABLES DE ESTADO GLOBALES Y DE FILTRADO
  // =========================================================================
  let cacheClientes = [];
  let cacheTareas = [];
  let relacionadosSeleccionados = [];
  let usuarioLogueado = ""; // Variable para almacenar el usuario que inició sesión

  // Variables activas para la combinación simultánea de filtros
  let filtroEstadoActual = "";      
  let filtroPrioridadActual = "";   
  let filtroVencimientoActual = ""; 
  let filtroResponsableActual = "Todos";

  // Estado y caché del módulo Renovaciones
  let cacheRenovaciones = [];
  let cachePolizasGeneral = [];
  let paginaActualPolizas = 1;
  const TAMANO_PAGINA_POLIZAS = 10;
  let filtroVencimientoRenovacionActual = "";

  window.onload = () => {
    // Al cargar, no mostramos nada hasta que se loguee (se maneja en el HTML)
  };

  // =========================================================================
  // SECTOR 2: LÓGICA CENTRAL DE FILTROS COMBINADOS
  // =========================================================================
  
  /**
   * Procesa la memoria cacheTareas aplicando simultáneamente todos los criterios
   * activos (Buscador, Responsable, Estado, Prioridad y Vencimiento).
   */
  function aplicarFiltrosCombinados() {
    const textoBuscador = document.getElementById('buscador-tarea').value.toLowerCase().trim();
    const hoy = new Date();
    hoy.setHours(0,0,0,0);

    let tareasFiltradas = cacheTareas.filter(t => {
      
      // 1. Filtro por Cuadro de Búsqueda (Texto)
      if (textoBuscador !== "") {
        const cumpleBusqueda = 
          (t.clienteNombre && t.clienteNombre.toLowerCase().includes(textoBuscador)) ||
          (t.tipoTarea && t.tipoTarea.toLowerCase().includes(textoBuscador)) ||
          (t.compania && t.compania.toLowerCase().includes(textoBuscador)) ||
          (t.descripcion && t.descripcion.toLowerCase().includes(textoBuscador)) ||
          (t.ramo && t.ramo.toLowerCase().includes(textoBuscador));
          
        if (!cumpleBusqueda) return false;
      }

      // 2. CORRECCIÓN: Filtro Cruzado por Responsable (Tolerante a espacios y case-insensitive)
      if (filtroResponsableActual !== "Todos") {
        if (!t.responsable) return false;
        const respTarea = t.responsable.toString().toLowerCase().trim();
        const respFiltro = filtroResponsableActual.toString().toLowerCase().trim();
        if (respTarea !== respFiltro) return false;
      }

      // 3. Filtro por Estado (Chips)
      if (filtroEstadoActual !== "") {
        if (t.estado !== filtroEstadoActual) return false;
      }

      // 4. Filtro por Prioridad (Urgentes)
      if (filtroPrioridadActual !== "") {
        if (t.prioridad !== filtroPrioridadActual) return false;
      }

      // 5. Filtro por Vencimiento (Vencidas o Próximas)
      if (filtroVencimientoActual === "vencidas") {
        if (!t.vencimiento || t.estado === 'Terminado') return false;
        const fVenc = new Date(t.vencimiento + "T00:00:00");
        if (fVenc >= hoy) return false;
      } 
      else if (filtroVencimientoActual === "proximas") {
        if (!t.vencimiento || t.estado === 'Terminado') return false;
        const fVenc = new Date(t.vencimiento + "T00:00:00");
        const limite = new Date();
        limite.setDate(hoy.getDate() + 7);
        limite.setHours(23,59,59,999);
        if (fVenc < hoy || fVenc > limite) return false;
      }

      return true;
    });

    renderTablaFiltradaDirecta(tareasFiltradas);
  }

  /**
   * Dibuja la tabla del Historial respetando estrictamente las columnas de tu Index.html
   */
  function eliminarTareaDesdeListado(idFila) {
    if (!confirm("¿Eliminar esta tarea?")) return;

    google.script.run
      .withSuccessHandler(() => {
        mostrarMensajeExito("Tarea eliminada");
        uiConsultarTareas();
      })
      .withFailureHandler(error => {
        mostrarMensajeExito("Error al eliminar: " + error.message);
      })
      .marcarTareaComoEliminada(idFila);
  }

  function renderTablaFiltradaDirecta(lista) {
    const tbody = document.getElementById('cuerpo-tabla');
    if (!tbody) return;
    tbody.innerHTML = '';

    // Excluimos 'Terminado' a menos que estemos filtrando por ese estado explícitamente
    let listaFinal = lista;
    if (filtroEstadoActual !== 'Terminado') {
      listaFinal = lista.filter(t => t.estado !== 'Terminado');
    }

    if (listaFinal.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--secondary);">No se encontraron tareas pendientes</td></tr>`;
      return;
    }

    // Ordenamos cronológicamente por fecha de vencimiento
    const copia = [...listaFinal].sort((a, b) => new Date(a.vencimiento) - new Date(b.vencimiento));

    copia.forEach(t => {
      const tr = document.createElement('tr');
      const jsonStr = encodeURIComponent(JSON.stringify(t));

      const fCreacion = t.creacion ? t.creacion.split('-').reverse().join('/') : '';
      const fVencim = t.vencimiento ? t.vencimiento.split('-').reverse().join('/') : '';

      tr.innerHTML = `
        <td>
          <button type="button" class="btn-icon" title="Editar Tarea" onclick="prepararEdicionTarea('${jsonStr}')">✏️</button>
          <button type="button" class="btn-icon" title="Eliminar Tarea" onclick="eliminarTareaDesdeListado(${t.id_fila})" style="color:var(--danger);">✕</button>
        </td>
        <td>${fCreacion}</td>
        <td style="${estiloVencimientoTarea(t.vencimiento)}">${fVencim}</td>
        <td>
          <a href="#" class="enlace-cliente-tabla" onclick="viajarAlCliente('${t.idCliente}'); return false;">
            ${t.clienteNombre}
          </a>
        </td>
        <td>${t.compania || ''}</td>
        <td>${t.tipoTarea || ''}</td>
        <td style="font-weight:500; color:var(--zoho-nav);">${t.ramo || '-'}</td>
        <td><span class="texto-descripcion" title="${t.descripcion || ''}">${t.descripcion || ''}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // =========================================================================
  // SECTOR 3: DISPARADORES ACCIONADOS POR BOTONES DE FILTRO (CHIPS)
  // =========================================================================
  function filtrarTablaGeneral() {
    aplicarFiltrosCombinados();
  }

  function filtrarPorResponsable(nombre) {
    filtroResponsableActual = nombre || "Todos";
    aplicarFiltrosCombinados();
  }

  /**
   * Modificado siguiendo tu sugerencia: Resetea los demás botones de filtro tipo chip 
   * para evitar solapamientos visuales o lógicos extraños.
   */
  function resetearSoloBotonesDeFiltro() {
    filtroEstadoActual = "";
    filtroPrioridadActual = "";
    filtroVencimientoActual = "";
    gestionarClasesFiltro('todas-btn');
  }

  function filtrarUrgentes() {
    const btn = document.querySelector('.urgente-btn');
    const yaEstabaActivo = btn && btn.classList.contains('active');
    
    resetearSoloBotonesDeFiltro(); // Limpia los otros botones
    
    if (!yaEstabaActivo) {
      filtroPrioridadActual = "Urgente";
      gestionarClasesFiltro('urgente-btn');
    }
    aplicarFiltrosCombinados();
  }

  function filtrarVencidas() {
    const btn = document.querySelector('.vencida-btn');
    const yaEstabaActivo = btn && btn.classList.contains('active');
    
    resetearSoloBotonesDeFiltro();
    
    if (!yaEstabaActivo) {
      filtroVencimientoActual = "vencidas";
      gestionarClasesFiltro('vencida-btn');
    }
    aplicarFiltrosCombinados();
  }

  function filtrarProximas(dias) {
    const btn = document.querySelector('.proxima-btn');
    const yaEstabaActivo = btn && btn.classList.contains('active');
    
    resetearSoloBotonesDeFiltro();
    
    if (!yaEstabaActivo) {
      filtroVencimientoActual = "proximas";
      gestionarClasesFiltro('proxima-btn');
    }
    aplicarFiltrosCombinados();
  }

  function filtrarPorEstadoPersonalizado(estado, claseBoton) {
    const btn = document.querySelector(`.${claseBoton}`);
    const yaEstabaActivo = btn && btn.classList.contains('active');
    
    resetearSoloBotonesDeFiltro();
    
    if (!yaEstabaActivo) {
      filtroEstadoActual = estado;
      gestionarClasesFiltro(claseBoton);
    }
    aplicarFiltrosCombinados();
  }

  function limpiarTodosLosFiltros() {
    filtroEstadoActual = "";
    filtroPrioridadActual = "";
    filtroVencimientoActual = "";
    filtroResponsableActual = "Todos";
    
    const inputBuscador = document.getElementById('buscador-tarea');
    if (inputBuscador) inputBuscador.value = "";
    
    const selectResponsable = document.getElementById('filtro-responsable');
    if (selectResponsable) selectResponsable.value = 'Todos';
    
    gestionarClasesFiltro('todas-btn');
    aplicarFiltrosCombinados();
  }

  // =========================================================================
  // SECTOR 4: ACCESO DEL SISTEMA (LOGIN Y MENÚ DE SECCIONES)
  // =========================================================================
  function ejecutarLogin() {
    const u = document.getElementById('user').value;
    const p = document.getElementById('pass').value;
    
    if(!u || !p) {
      mostrarMensajeExito("Por favor, complete todos los campos");
      return;
    }

    google.script.run.withSuccessHandler(r => {
      if(r.exito) {
        usuarioLogueado = r.usuario;
        document.getElementById('pantalla-login').style.display = 'none';
        document.getElementById('contenedor-app').style.display = 'block';
        
        // --- CARGAR RESPONSABLES AL INICIAR SESIÓN ---
        google.script.run.withSuccessHandler(responsables => {
          const ids = ['tarea-responsable', 'filtro-responsable'];
          ids.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
              el.options.length = 1; 
              responsables.forEach(res => {
                let opt = document.createElement('option');
                opt.value = res;
                opt.text = res;
                el.add(opt);
              });
            }
          });
        }).obtenerResponsables();
        
        // --- CARGAR RAMOS DESDE LA HOJA RAMO ---
        google.script.run.withSuccessHandler(ramos => {
          const idsRamo = ['tarea-ramo', 'renovacion-ramo', 'poliza-manual-ramo'];
          idsRamo.forEach(id => {
            const elRamo = document.getElementById(id);
            if (elRamo) {
              elRamo.options.length = 1; 
              ramos.forEach(ramo => {
                let opt = document.createElement('option');
                opt.value = ramo;
                opt.text = ramo;
                elRamo.add(opt);
              });
            }
          });
        }).obtenerRamosLista();

        const primerBoton = document.getElementById('nav-historial-tareas');
        mostrarSeccion('consulta', primerBoton);
        mostrarMensajeExito("Bienvenido " + u);
      } else {
        mostrarMensajeExito(r.mensaje);
      }
    }).validarLogin(u, p);
  }

  function volverAHistorial() {
    const btnConsulta = document.querySelector('.nav-item');
    mostrarSeccion('consulta', btnConsulta);
  }

  function mostrarSeccion(id, elemento) {
    document.querySelectorAll('.modulo').forEach(m => m.style.display = 'none');
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    if(elemento) elemento.classList.add('active');
    
    actualizarListaClientesGlobal();
    if(id === 'consulta' || id === 'historial-cliente') {
      uiConsultarTareas();
    }
    if(id === 'renovaciones') {
      uiConsultarRenovaciones();
    }
    if(id === 'polizas') {
      uiConsultarPolizasGeneral();
    }
    if(id === 'siniestros') {
      uiConsultarSiniestros();
    }
    if(id === 'vencimientos-fp') {
      uiConsultarVencimientosFP();
    }
  }

  // =========================================================================
  // SECTOR 5: GESTIÓN DE TAREAS (UI, RENDER BASE ORIGINAL, GRABACIÓN Y ELIMINACIÓN)
  // =========================================================================
  function uiConsultarTareas() {
    google.script.run.withSuccessHandler(t => {
      cacheTareas = t;
      aplicarFiltrosCombinados(); 
      const idCli = document.getElementById('select-cliente-historial').value;
      if(idCli) uiFiltrarTareasPorCliente(idCli);
    }).obtenerTareas();
  }

  function renderTabla(lista, idCuerpo) {
    const tbody = document.getElementById(idCuerpo);
    if (!tbody) return;
    tbody.innerHTML = '';

    const esFiltroTerminado = lista.length > 0 && lista.every(t => t.estado === 'Terminado');
    let listaFiltrada = lista;
    if (!esFiltroTerminado) {
      listaFiltrada = lista.filter(t => t.estado !== 'Terminado');
    }

    if (listaFiltrada.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--secondary);">No se encontraron tareas pendientes</td></tr>`;
      return;
    }

    const copia = [...listaFiltrada].sort((a, b) => new Date(a.vencimiento) - new Date(b.vencimiento));

    copia.forEach(t => {
      const tr = document.createElement('tr');
      const jsonStr = encodeURIComponent(JSON.stringify(t));

      const fCreacion = t.creacion ? t.creacion.split('-').reverse().join('/') : '';
      const fVencim = t.vencimiento ? t.vencimiento.split('-').reverse().join('/') : '';

      tr.innerHTML = `
        <td>
          <button type="button" class="btn-icon" title="Editar Tarea" onclick="prepararEdicionTarea('${jsonStr}')">✏️</button>
        </td>
        <td>${fCreacion}</td>
        <td style="${estiloVencimientoTarea(t.vencimiento)}">${fVencim}</td>
        <td>
          <a href="#" class="enlace-cliente-tabla" onclick="viajarAlCliente('${t.idCliente}'); return false;">
            ${t.clienteNombre}
          </a>
        </td>
        <td>${t.compania || ''}</td>
        <td>${t.tipoTarea || ''}</td>
        <td style="font-weight:500; color:var(--zoho-nav);">${t.ramo || '-'}</td> <td><span class="texto-descripcion" title="${t.descripcion || ''}">${t.descripcion || ''}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function uiGuardarTarea() {
    let idCli = document.getElementById('select-cliente').value;
    
    if (!idCli || idCli === "") {
      const contenedorBloqueado = document.getElementById('cliente-bloqueado');
      if (contenedorBloqueado.style.display === 'block') {
        const nombreFijo = document.getElementById('nombre-cliente-fijo').value;
        const clienteEncontrado = cacheClientes.find(c => c.nombre === nombreFijo);
        if (clienteEncontrado) idCli = clienteEncontrado.id;
      }
    }

    if(!idCli || idCli === "") {
      mostrarMensajeExito("Error: No se pudo identificar al cliente");
      return;
    }

    const btn = document.getElementById('btn-guardar-tarea');
    const file = document.getElementById('tarea-adjunto').files[0];
    btn.disabled = true; 
    btn.innerText = "Procesando...";

    const enviar = (url) => {
      const t = {
        id_fila: document.getElementById('tarea-id-fila').value,
        idCliente: idCli,
        tipoTarea: document.getElementById('tarea-tipo').value,
        compania: document.getElementById('tarea-compania').value,
        estado: document.getElementById('tarea-estado').value,
        prioridad: document.getElementById('tarea-prioridad').value,
        vencimiento: document.getElementById('tarea-vencimiento').value,
        ramo: document.getElementById('tarea-ramo').value, 
        responsable: document.getElementById('tarea-responsable').value,
        numeroSiniestro: document.getElementById('tarea-numero-siniestro').value.trim(),
        descripcion: document.getElementById('tarea-desc').value,
        adjunto: url || ""
      };

      google.script.run.withSuccessHandler(r => {
        mostrarMensajeExito("Tarea guardada con éxito");
        limpiarFormTarea();
        const btnConsulta = document.querySelector('button[onclick*="consulta"]');
        mostrarSeccion('consulta', btnConsulta);
      }).guardarTarea(t, usuarioLogueado); 
    };

    if (file) {
      const reader = new FileReader();
      reader.onload = e => google.script.run.withSuccessHandler(url => enviar(url)).subirArchivoADrive(e.target.result, file.name);
      reader.readAsDataURL(file);
    } else {
      enviar("");
    }
  }

  function prepararEdicionTarea(json) {
    const t = JSON.parse(decodeURIComponent(json));
    const btnTarea = document.getElementById('nav-nueva-tarea');
    mostrarSeccion('tareas', btnTarea);
    document.getElementById('tarea-id-fila').value = t.id_fila;
    document.getElementById('contenedor-seleccion-cliente').style.display = 'none';
    document.getElementById('cliente-bloqueado').style.display = 'block';
    document.getElementById('nombre-cliente-fijo').value = t.clienteNombre;
    document.getElementById('select-cliente').value = t.idCliente;
    document.getElementById('tarea-tipo').value = t.tipoTarea || "";
    document.getElementById('tarea-compania').value = t.compania;
    document.getElementById('tarea-estado').value = t.estado;
    document.getElementById('tarea-prioridad').value = t.prioridad;
    document.getElementById('tarea-responsable').value = t.responsable || "";
    document.getElementById('tarea-ramo').value = t.ramo || ""; 
    document.getElementById('tarea-numero-siniestro').value = t.numeroSiniestro || "";
    document.getElementById('tarea-vencimiento').type = 'date';
    document.getElementById('tarea-vencimiento').value = t.vencimiento;
    document.getElementById('tarea-desc').value = t.descripcion;
    document.getElementById('nombre-cliente-tarea-cabecera').innerText = t.clienteNombre.toUpperCase();

    document.getElementById('tarea-desc').value = t.descripcion;
    document.getElementById('nombre-cliente-tarea-cabecera').innerText = t.clienteNombre.toUpperCase();
  }

  function filtrarPorEstado(estado) {
    const filtradas = cacheTareas.filter(t => t.estado === estado);
    renderTabla(filtradas, 'cuerpo-tabla');
  }

  function limpiarFormTarea() {
    document.getElementById('form-tarea').reset();
    document.getElementById('tarea-id-fila').value = "";
    document.getElementById('tarea-vencimiento').type = 'date';
    
    const hoy = new Date();
    const mañana = new Date(hoy);
    mañana.setDate(hoy.getDate() + 1); 
    
    const año = mañana.getFullYear();
    const mes = String(mañana.getMonth() + 1).padStart(2, '0');
    const dia = String(mañana.getDate()).padStart(2, '0');
    
    document.getElementById('tarea-vencimiento').value = `${año}-${mes}-${dia}`;

    document.getElementById('contenedor-seleccion-cliente').style.display = 'block';
    document.getElementById('cliente-bloqueado').style.display = 'none';
    document.getElementById('nombre-cliente-tarea-cabecera').innerText = "";
    document.getElementById('btn-guardar-tarea').disabled = false;
    document.getElementById('btn-guardar-tarea').innerText = "Guardar Tarea";
  }

  function actualizarNombreCabeceraTarea() {
    const s = document.getElementById('select-cliente');
    document.getElementById('nombre-cliente-tarea-cabecera').innerText = s.selectedIndex > 0 ? s.options[s.selectedIndex].text.toUpperCase() : "";
  }

  // =========================================================================
  // SECTOR 6: GESTIÓN DE CLIENTES Y EDICIONES
  // =========================================================================
  function actualizarListaClientesGlobal() {
    google.script.run.withSuccessHandler(cs => {
      cacheClientes = cs;
      filtrarSelectClientes(""); 
      filtrarSelectHistorial(""); 
      filtrarSelectTarea("");
      
      const sVinc = document.getElementById('lista-clientes-vincular');
      if(sVinc){
        sVinc.innerHTML = '<option value="">-- Buscar para vincular --</option>';
        cs.forEach(c => {
          let o = document.createElement('option'); o.value = c.id; o.text = c.nombre; sVinc.add(o);
        });
      }
    }).obtenerListaClientes();
  }

  function cargarDatosClienteEdicion(idCliente) {
    if (!idCliente) {
      limpiarFormCliente();
      return;
    }

    const cliente = cacheClientes.find(c => c.id == idCliente);
    if (!cliente) return;

    document.getElementById('cliente-id').value = cliente.id;
    document.getElementById('nombre').value = cliente.nombre || "";
    document.getElementById('dni').value = cliente.dni || "";
    document.getElementById('domicilio').value = cliente.domicilio || "";
    document.getElementById('telefono').value = cliente.telefono || "";
    document.getElementById('email').value = cliente.email || "";
    document.getElementById('rivadavia').value = cliente.rivadavia || "";
    document.getElementById('provincia').value = cliente.provincia || "";
    document.getElementById('fedPatronal').value = cliente.fedPatronal || "";
    document.getElementById('cliente-observaciones').value = cliente.observaciones || "";
    document.getElementById('renovacion-combinado-familiar').value = cliente.renovacionCombinadoFamiliar || "";

    document.getElementById('titulo-cliente').innerText = "Consulta de Cliente: " + cliente.nombre.toUpperCase();

    alternarEstadoCamposCliente(true);

    document.getElementById('btn-editar-cliente').style.display = 'inline-block';
    document.getElementById('btn-guardar-cliente').style.display = 'none';

    const tareasAsociadas = cacheTareas.filter(t => t.idCliente == idCliente);
    renderTabla(tareasAsociadas, 'cuerpo-tabla-cliente-directo');
    document.getElementById('modulo-tareas-asociadas').style.display = 'block';

    cargarPolizasCliente(idCliente);
    habilitarCamposPolizaManual(true);
    
    if (typeof dibujarRelacionados === "function") {
      dibujarRelacionados(cliente.relaciones || []);
    }
  }

  function uiGuardarCliente() {
    const nombre = document.getElementById('nombre').value.toUpperCase().trim();
    if (!nombre) {
      mostrarMensajeExito("El nombre del cliente es obligatorio");
      return;
    }

    const d = {
      id: document.getElementById('cliente-id').value,
      nombre: nombre,
      dni: document.getElementById('dni').value.trim(), 
      domicilio: document.getElementById('domicilio').value.trim(),
      telefono: document.getElementById('telefono').value.trim(),
      email: document.getElementById('email').value.trim(),
      rivadavia: document.getElementById('rivadavia').value.trim(),
      provincia: document.getElementById('provincia').value.trim(),
      fedPatronal: document.getElementById('fedPatronal').value.trim(),
      relacionados: relacionadosSeleccionados,
      observaciones: document.getElementById('cliente-observaciones').value.trim()
    };

    google.script.run.withSuccessHandler(r => {
      mostrarMensajeExito("Cliente guardado con éxito");
      limpiarFormCliente();
      actualizarListaClientesGlobal(); 
    }).guardarCliente(d);
  }

  function habilitarEdicionCliente() {
    const nombreCliente = document.getElementById('nombre').value;
    document.getElementById('titulo-cliente').innerText = "Editando Cliente: " + nombreCliente.toUpperCase();
    alternarEstadoCamposCliente(false);
    document.getElementById('btn-editar-cliente').style.display = 'none';
    document.getElementById('btn-guardar-cliente').style.display = 'inline-block';
  }

  function alternarEstadoCamposCliente(bloquear) {
    const campos = [
      'nombre', 'dni', 'domicilio', 'telefono', 'email', 
      'rivadavia', 'provincia', 'fedPatronal', 
      'lista-clientes-vincular', 'select-rol', 'cliente-observaciones'
    ];
    campos.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.disabled = bloquear;
    });
    const btnVincular = document.getElementById('btn-vincular-cliente');
    if (btnVincular) btnVincular.disabled = bloquear;

  // Busca por palabras sueltas en cualquier orden: "MATIAS MAU" matchea
  // "MAURINO MATIAS" (antes exigía la frase completa como bloque, en el
  // mismo orden en que la tipeabas, y por eso fallaba con Apellido Nombre).
  // Devuelve el estilo inline para la celda de Vencimiento: rojo y en negrita
  // si la fecha ya pasó (vencida), el estilo normal si no.
  function estiloVencimientoTarea(fechaISO) {
    if (!fechaISO) return 'font-weight:600;';
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const fVenc = new Date(fechaISO + "T00:00:00");
    if (fVenc instanceof Date && !isNaN(fVenc) && fVenc < hoy) {
      return 'font-weight:700; color:var(--danger);';
    }
    return 'font-weight:600;';
  }

  function coincideBusquedaCliente(nombre, query) {
    const palabras = query.toLowerCase().trim().split(/\s+/).filter(p => p.length > 0);
    if (palabras.length === 0) return true;
    const nombreLower = nombre.toLowerCase();
    return palabras.every(palabra => nombreLower.includes(palabra));
  }

  // Comisión / Premio, expresado en porcentaje. Vacío si no hay datos numéricos.
  function calcularPorcentajeComision(premio, comision) {
    const p = parseFloat(premio);
    const c = parseFloat(comision);
    if (!p || isNaN(p) || isNaN(c)) return '';
    return ((c / p) * 100).toFixed(2) + '%';
  }

  function agregarPolizaManual() {
    const idCliente = document.getElementById('cliente-id').value;
    if (!idCliente) {
      mostrarMensajeExito("Primero seleccioná o guardá un cliente");
      return;
    }

    const numero = document.getElementById('poliza-manual-numero').value.trim();
    if (!numero) {
      mostrarMensajeExito("Ingresá el número de póliza");
      return;
    }

    const datos = {
      idCliente: idCliente,
      compania: document.getElementById('poliza-manual-compania').value,
      ramo: document.getElementById('poliza-manual-ramo').value,
      poliza: numero,
      productor: document.getElementById('poliza-manual-productor').value.trim()
    };

    const btn = document.getElementById('btn-agregar-poliza-manual');
    const textoOriginal = btn.innerText;
    btn.disabled = true;
    btn.innerText = "Guardando...";

    google.script.run
      .withSuccessHandler(() => {
        mostrarMensajeExito("Póliza agregada");
        document.getElementById('poliza-manual-ramo').value = "";
        document.getElementById('poliza-manual-numero').value = "";
        document.getElementById('poliza-manual-productor').value = "";
        btn.disabled = false;
        btn.innerText = textoOriginal;
        cargarPolizasCliente(idCliente);
      })
      .withFailureHandler(error => {
        mostrarMensajeExito("Error al guardar: " + error.message);
        btn.disabled = false;
        btn.innerText = textoOriginal;
      })
      .guardarPolizaManual(datos, usuarioLogueado);

  function aplicarFiltrosPolizas() {
    const texto = document.getElementById('buscador-poliza').value.toLowerCase().trim();
    const productor = document.getElementById('filtro-productor-polizas').value;
    const ramo = document.getElementById('filtro-ramo-polizas').value;

    const filtradas = cachePolizasGeneral.filter(p => {
      if (productor !== "Todos" && p.productor !== productor) return false;
      if (ramo !== "Todos" && p.ramo !== ramo) return false;

      if (texto !== "") {
        const campoBusqueda = [p.poliza, p.clienteNombre, p.cia].join(" ");
        if (!coincideBusquedaCliente(campoBusqueda, texto)) return false;

      return true;

    paginaActualPolizas = 1;
    renderTablaPolizasGeneral(filtradas);

  function renderTablaPolizasGeneral(lista) {
    cachePolizasFiltradasActuales = lista;
    const tbody = document.getElementById('cuerpo-tabla-polizas-general');
    tbody.innerHTML = '';

    if (!lista || lista.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--secondary);">No se encontraron pólizas</td></tr>`;
      document.getElementById('texto-paginacion-polizas').innerText = 'Página 1 de 1';
      document.getElementById('btn-pagina-anterior-polizas').disabled = true;
      document.getElementById('btn-pagina-siguiente-polizas').disabled = true;
      return;
    }

    const totalPaginas = Math.max(1, Math.ceil(lista.length / TAMANO_PAGINA_POLIZAS));
    if (paginaActualPolizas > totalPaginas) paginaActualPolizas = totalPaginas;
    if (paginaActualPolizas < 1) paginaActualPolizas = 1;

    const inicio = (paginaActualPolizas - 1) * TAMANO_PAGINA_POLIZAS;
    const paginaDeItems = lista.slice(inicio, inicio + TAMANO_PAGINA_POLIZAS);

    paginaDeItems.forEach(p => {
      const tr = document.createElement('tr');
      const nombreCliente = p.idCliente
        ? `<a href="#" class="enlace-cliente-tabla" onclick="viajarAlCliente('${p.idCliente}'); return false;">${p.clienteNombre}</a>`
        : `<span style="color:var(--secondary);" title="No se encontró un cliente vinculado por matrícula">${p.clienteNombre}</span>`;
      const badge = p.pendiente
        ? ' <span style="background:#fef3c7; color:#92400e; font-size:10px; padding:2px 6px; border-radius:8px; font-weight:600;">PENDIENTE</span>'
        : '';

      tr.innerHTML = `
        <td>${p.productor || ''}</td>
        <td style="font-weight:500; color:var(--zoho-nav);">${p.ramo || '-'}${badge}</td>
        <td>${p.poliza || ''}</td>
        <td>${nombreCliente}</td>
        <td>${p.cia || ''}</td>
        <td>${p.ultimaFecha || ''}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('texto-paginacion-polizas').innerText = `Página ${paginaActualPolizas} de ${totalPaginas}`;
    document.getElementById('btn-pagina-anterior-polizas').disabled = (paginaActualPolizas <= 1);
    document.getElementById('btn-pagina-siguiente-polizas').disabled = (paginaActualPolizas >= totalPaginas);

  function subirYProcesarVencimientosFP() {
    const input = document.getElementById('vencimientos-fp-archivo');
    const archivo = input.files[0];
    const mensajeEl = document.getElementById('mensaje-vencimientos-fp');

    if (!archivo) {
      mensajeEl.innerText = "Elegí un archivo CSV primero.";
      return;
    }

    const btn = document.getElementById('btn-procesar-vencimientos-fp');
    btn.disabled = true;
    mensajeEl.innerText = "Subiendo archivo...";

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64 = e.target.result;
      google.script.run
        .withSuccessHandler(resultadoSubida => {
          if (!resultadoSubida.exito) {
            mensajeEl.innerText = "Error al subir: " + resultadoSubida.mensaje;
            btn.disabled = false;
            return;
          }
          mensajeEl.innerText = "Archivo subido. Procesando filas...";
          google.script.run
            .withSuccessHandler(resultado => {
              mensajeEl.innerText = "Listo: se crearon " + resultado.tareasCreadas + " tareas nuevas (" + resultado.omitidas + " pólizas ya estaban cargadas, " + resultado.noBase + " eran endosos/movimientos no base y se saltearon).";
              input.value = "";
              btn.disabled = false;
              uiConsultarVencimientosFP();
            })
            .withFailureHandler(error => {
              mensajeEl.innerText = "Error al procesar: " + error.message;
              btn.disabled = false;
            })
            .procesarVencimientosFP();
        })
        .withFailureHandler(error => {
          mensajeEl.innerText = "Error al subir: " + error.message;
          btn.disabled = false;
        })
        .subirCSVVencimientosFP(base64, archivo.name);
    };
    reader.readAsDataURL(archivo);
  }

  function uiConsultarVencimientosFP() {
    const tbody = document.getElementById('cuerpo-tabla-vencimientos-fp');
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--secondary);">Buscando vencimientos...</td></tr>`;

    google.script.run
      .withSuccessHandler(lista => {
        cacheVencimientosFP = lista;
        poblarFiltrosVencimientosFP(lista);
        aplicarFiltrosVencimientosFP();
      })
      .withFailureHandler(error => {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--danger);">Error al buscar vencimientos: ${error.message}</td></tr>`;
      })
      .obtenerVencimientosFP();

    cargarHistorialVencimientosFP();
  }

  function cargarHistorialVencimientosFP() {
    const tbody = document.getElementById('cuerpo-tabla-historial-vencimientos-fp');
    google.script.run
      .withSuccessHandler(historial => {
        renderHistorialVencimientosFP(historial);
      })
      .withFailureHandler(error => {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--danger);">Error al cargar el historial: ${error.message}</td></tr>`;
      })
      .obtenerHistorialVencimientosFP();
  }

  function renderHistorialVencimientosFP(historial) {
    const tbody = document.getElementById('cuerpo-tabla-historial-vencimientos-fp');
    tbody.innerHTML = '';

    if (!historial || historial.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--secondary);">Todavía no se importó ningún archivo</td></tr>`;
      return;
    }

    historial.forEach(h => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${h.fechaImportacion || ''}</td>
        <td>${h.productor || ''}</td>
        <td>${h.cantidad || ''}</td>
        <td>${h.desde || ''}</td>
        <td>${h.hasta || ''}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function poblarFiltrosVencimientosFP(lista) {
    const selResponsable = document.getElementById('filtro-responsable-vencimientos-fp');
    const selRamo = document.getElementById('filtro-ramo-vencimientos-fp');
    const responsableActual = selResponsable.value || "Todos";
    const ramoActual = selRamo.value || "Todos";

    const responsables = [...new Set(lista.map(v => v.responsable).filter(r => r))].sort();
    const ramos = [...new Set(lista.map(v => v.ramo).filter(r => r))].sort();

    selResponsable.innerHTML = '<option value="Todos">Responsable: Todos</option>';
    responsables.forEach(r => {
      const o = document.createElement('option'); o.value = r; o.text = r; selResponsable.add(o);
    });
    selResponsable.value = responsables.includes(responsableActual) ? responsableActual : "Todos";

    selRamo.innerHTML = '<option value="Todos">Ramo: Todos</option>';
    ramos.forEach(r => {
      const o = document.createElement('option'); o.value = r; o.text = r; selRamo.add(o);
    });
    selRamo.value = ramos.includes(ramoActual) ? ramoActual : "Todos";
  }

  function filtrarTablaVencimientosFP() {
    aplicarFiltrosVencimientosFP();
  }

  function limpiarFiltrosVencimientosFP() {
    document.getElementById('buscador-vencimiento-fp').value = "";
    document.getElementById('filtro-responsable-vencimientos-fp').value = "Todos";
    document.getElementById('filtro-ramo-vencimientos-fp').value = "Todos";
    aplicarFiltrosVencimientosFP();
  }

  function aplicarFiltrosVencimientosFP() {
    const texto = document.getElementById('buscador-vencimiento-fp').value.toLowerCase().trim();
    const responsable = document.getElementById('filtro-responsable-vencimientos-fp').value;
    const ramo = document.getElementById('filtro-ramo-vencimientos-fp').value;

    const filtradas = cacheVencimientosFP.filter(v => {
      if (responsable !== "Todos" && v.responsable !== responsable) return false;
      if (ramo !== "Todos" && v.ramo !== ramo) return false;

      if (texto !== "") {
        const campoBusqueda = [v.numeroSiniestro, v.clienteNombre, v.ramo, v.descripcion].join(" ");
        if (!coincideBusquedaCliente(campoBusqueda, texto)) return false;
      }

      return true;
    });

    renderTablaVencimientosFP(filtradas);
  }

  function renderTablaVencimientosFP(lista) {
    const tbody = document.getElementById('cuerpo-tabla-vencimientos-fp');
    tbody.innerHTML = '';

    if (!lista || lista.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--secondary);">No se encontraron vencimientos</td></tr>`;
      return;
    }

    const copia = [...lista].sort((a, b) => new Date(a.vencimiento) - new Date(b.vencimiento));

    copia.forEach(v => {
      const tr = document.createElement('tr');
      const jsonStr = encodeURIComponent(JSON.stringify(v));
      const fVencim = v.vencimiento ? v.vencimiento.split('-').reverse().join('/') : '';

      tr.innerHTML = `
        <td>
          <button type="button" class="btn-icon" title="Editar Tarea" onclick="prepararEdicionTarea('${jsonStr}')">✏️</button>
        </td>
        <td>${v.creacion || ''}</td>
        <td style="${estiloVencimientoTarea(v.vencimiento)}">${fVencim}</td>
        <td>
          <a href="#" class="enlace-cliente-tabla" onclick="viajarAlCliente('${v.idCliente}'); return false;">
            ${v.clienteNombre}
          </a>
        </td>
        <td>${v.compania || ''}</td>
        <td style="font-weight:500; color:var(--zoho-nav);">${v.ramo || '-'}</td>
        <td>${v.numeroSiniestro || ''}</td>
        <td><span class="texto-descripcion" title="${v.descripcion || ''}">${v.descripcion || ''}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- Listado general del módulo Renovaciones ---
  function uiConsultarRenovaciones() {
    google.script.run.withSuccessHandler(r => {
      cacheRenovaciones = r;
      aplicarFiltrosRenovaciones();
    }).obtenerRenovaciones();
  }

  function aplicarFiltrosRenovaciones() {
    const textoBuscador = document.getElementById('buscador-renovacion').value.toLowerCase().trim();
    const hoy = new Date();
    hoy.setHours(0,0,0,0);

    let filtradas = cacheRenovaciones.filter(r => {
      if (textoBuscador !== "") {
        const cumple =
          (r.clienteNombre && r.clienteNombre.toLowerCase().includes(textoBuscador)) ||
          (r.ramo && r.ramo.toLowerCase().includes(textoBuscador)) ||
          (r.frecuencia && r.frecuencia.toLowerCase().includes(textoBuscador)) ||
          (r.comentario && r.comentario.toLowerCase().includes(textoBuscador));
        if (!cumple) return false;
      }

      if (filtroVencimientoRenovacionActual === "vencidas") {
        if (!r.vencimiento) return false;
        const fVenc = new Date(r.vencimiento + "T00:00:00");
        if (fVenc >= hoy) return false;
      } else if (filtroVencimientoRenovacionActual === "proximas") {
        if (!r.vencimiento) return false;
        const fVenc = new Date(r.vencimiento + "T00:00:00");
        const limite = new Date();
        limite.setDate(hoy.getDate() + 7);
        limite.setHours(23,59,59,999);
        if (fVenc < hoy || fVenc > limite) return false;
      }

      return true;
    });

    renderTablaRenovaciones(filtradas);
  }

  function renderTablaRenovaciones(lista) {
    const tbody = document.getElementById('cuerpo-tabla-renovaciones');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (lista.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--secondary);">No se encontraron renovaciones</td></tr>`;
      return;
    }

    const hoy = new Date();
    hoy.setHours(0,0,0,0);

    const copia = [...lista].sort((a, b) => new Date(a.vencimiento) - new Date(b.vencimiento));

    copia.forEach(r => {
      const tr = document.createElement('tr');
      const fVenc = r.vencimiento ? new Date(r.vencimiento + "T00:00:00") : null;
      const claseFila = (fVenc && fVenc < hoy) ? 'urgente' : 'normal';

      tr.innerHTML = `
        <td>
          <button type="button" class="btn-icon" title="Eliminar Renovación" onclick="eliminarRenovacionDesdeListado(${r.id_fila})">🗑️</button>
          <button type="button" class="btn-icon" title="Generar 10 tareas más" onclick="regenerarTareasRenovacionUI(${r.id_fila})">🔁</button>
        </td>
        <td>${r.creacion || ''}</td>
        <td class="${claseFila}" style="font-weight:600;">${r.vencimientoFormat || ''}</td>
        <td>
          <a href="#" class="enlace-cliente-tabla" onclick="viajarAlCliente('${r.idCliente}'); return false;">
            ${r.clienteNombre}
          </a>
        </td>
        <td>${r.frecuencia || '-'}</td>
        <td>${r.compania || '-'}</td>
        <td style="font-weight:500; color:var(--zoho-nav);">${r.ramo || '-'}</td>
        <td><span class="texto-descripcion" title="${r.comentario || ''}">${r.comentario || ''}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function eliminarRenovacionDesdeListado(idFila) {
    if (!confirm("¿Eliminar esta renovación?")) return;
    google.script.run.withSuccessHandler(() => {
      mostrarMensajeExito("Renovación eliminada");
      uiConsultarRenovaciones();
    }).eliminarRenovacionEnServidor(idFila);
  }

  function regenerarTareasRenovacionUI(idFila) {
    if (!confirm("¿Generar 10 tareas más para esta renovación?")) return;
    google.script.run
      .withSuccessHandler(r => {
        const cantidad = (r && r.tareasCreadas) || 0;
        const hasta = (r && r.hasta) ? " (hasta " + r.hasta + ")" : "";
        mostrarMensajeExito("Se crearon " + cantidad + " tareas más" + hasta);
        uiConsultarRenovaciones();
        uiConsultarTareas();
      })
      .withFailureHandler(error => {
        mostrarMensajeExito("Error: " + error.message);
      })
      .regenerarTareasRenovacion(idFila);
  }

  function filtrarTablaRenovaciones() {
    aplicarFiltrosRenovaciones();
  }

  function limpiarFiltrosRenovacion() {
    filtroVencimientoRenovacionActual = "";
    document.getElementById('buscador-renovacion').value = "";
    gestionarClasesFiltroRenovacion(null);
    aplicarFiltrosRenovaciones();
  }

  function filtrarVencidasRenovacion() {
    const btn = document.querySelector('.vencida-ren-btn');
    const yaEstabaActivo = btn && btn.classList.contains('active');

    gestionarClasesFiltroRenovacion(null);

    if (!yaEstabaActivo) {
      filtroVencimientoRenovacionActual = "vencidas";
      gestionarClasesFiltroRenovacion('vencida-ren-btn');
    } else {
      filtroVencimientoRenovacionActual = "";
    }
    aplicarFiltrosRenovaciones();
  }

  function filtrarProximasRenovacion(dias) {
    const btn = document.querySelector('.proxima-ren-btn');
    const yaEstabaActivo = btn && btn.classList.contains('active');

    gestionarClasesFiltroRenovacion(null);

    if (!yaEstabaActivo) {
      filtroVencimientoRenovacionActual = "proximas";
      gestionarClasesFiltroRenovacion('proxima-ren-btn');
    } else {
      filtroVencimientoRenovacionActual = "";
    }
    aplicarFiltrosRenovaciones();
  }

  function gestionarClasesFiltroRenovacion(claseBotonActivo) {
    const botones = document.querySelectorAll('.filtro-renovaciones .btn-filter');
    botones.forEach(btn => btn.classList.remove('active'));
    if (claseBotonActivo) {
      const btnActivo = document.querySelector(`.filtro-renovaciones .${claseBotonActivo}`);
      if (btnActivo) btnActivo.classList.add('active');
    }
  }
</script>
